<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShardKV 集群控制台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #5cbdf5 0%, #852cef 100%);
            color: white;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header .subtitle { font-size: 12px; opacity: 0.85; margin-top: 2px; }
        .header .status-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,0.2);
            padding: 4px 12px; border-radius: 20px; font-size: 12px;
        }
        .badge-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #52c41a; display: inline-block;
        }

        .container {
            display: flex; gap: 12px; padding: 12px; max-width: 1600px; margin: 0 auto;
            height: calc(100vh - 52px);
            overflow: hidden;
            min-width: 0;
        }
        .main-panel {
            flex: 1;
            display: flex; flex-direction: column; gap: 12px;
            overflow: hidden auto;
            min-width: 0;
        }
        .right-panel {
            width: 460px; min-width: 380px;
            display: flex; flex-direction: column; gap: 0;
            background: #1a1a2e;
            border-radius: 10px;
            overflow: hidden;
        }

        .card {
            background: white; border-radius: 10px; padding: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .card h3 {
            font-size: 13px; font-weight: 600; margin-bottom: 10px;
            padding-bottom: 6px; border-bottom: 1px solid #eee;
            display: flex; align-items: center; justify-content: space-between;
        }
        .card h3 .actions {
            display: flex; gap: 6px; align-items: center;
        }

        .form-row { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; align-items: center; }
        .form-row input, .form-row select {
            flex: 1; padding: 7px 10px; border: 1px solid #d9d9d9; border-radius: 6px;
            font-size: 12px; outline: none; transition: border-color 0.2s;
        }
        .form-row input:focus { border-color: #667eea; box-shadow: 0 0 0 2px rgba(102,126,234,0.15); }

        select.dropdown {
            padding: 7px 10px; border: 1px solid #d9d9d9; border-radius: 6px;
            font-size: 12px; outline: none; background: white;
            cursor: pointer;
        }
        select.dropdown:focus { border-color: #667eea; box-shadow: 0 0 0 2px rgba(102,126,234,0.15); }

        .btn {
            padding: 7px 14px; border: none; border-radius: 6px; cursor: pointer;
            font-size: 12px; font-weight: 500; transition: all 0.2s; white-space: nowrap;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a6fd6; }
        .btn-danger { background: #ff4d4f; color: white; }
        .btn-danger:hover { background: #e04345; }
        .btn-success { background: #52c41a; color: white; }
        .btn-success:hover { background: #49b018; }
        .btn-success:disabled { background: #a0d878; cursor: not-allowed; opacity: 0.7; }

        /* 按钮抖动动画（防重发提示） */
        @keyframes btn-shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-4px); }
            40% { transform: translateX(4px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
        }

        /* 加载动画（写入中指示器） */
        .spinner {
            display: inline-block;
            width: 12px; height: 12px;
            border: 2px solid #52c41a;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 4px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* CAS 竞赛 spinner（模块主题色 #764ba2） */
        .spinner-cas {
            display: inline-block;
            width: 12px; height: 12px;
            border: 2px solid #764ba2;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 4px;
        }
        .btn-warning { background: #faad14; color: white; }
        .btn-warning:hover { background: #e8a012; }
        .btn-sm { padding: 3px 8px; font-size: 11px; }
        .btn-xs { padding: 2px 6px; font-size: 10px; border-radius: 4px; }

        .node-grid { display: flex; gap: 10px; flex-wrap: wrap; }
        .group-card {
            background: #fafafa; border: 1px solid #eee; border-radius: 8px;
            padding: 10px; flex: 1; min-width: 240px;
        }
        .group-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid #e8e8e8;
        }
        .group-header .gid { font-weight: 600; font-size: 13px; }
        .group-header .shard-count { font-size: 11px; color: #888; }
        .group-header .ops { display: flex; gap: 4px; align-items: center; }
        .server-item {
            display: flex; align-items: center; gap: 6px; padding: 3px 0;
            font-size: 12px;
        }
        .server-item .dot {
            width: 8px; height: 8px; border-radius: 50%; display: inline-block;
            flex-shrink: 0;
        }
        .dot.leader { background: #52c41a; box-shadow: 0 0 12px 1px #52c41a; }
        .dot.alive { background: #52c41a; opacity: 0.65; }
        .dot.dead { background: #ff4d4f; }
        .dot.isolated { background: #faad14; }
        .dot.leader-isolated { background: #faad14; box-shadow: 0 0 12px 1px #faad14; }

        .server-item .name { font-family: 'SF Mono', Monaco, monospace; font-size: 11px; flex: 1; min-width: 0; }
        .server-item .status-label { font-size: 10px; color: #888; }
        .server-item .actions { display: flex; gap: 3px; margin-left: auto; flex-shrink: 0; }

        .shard-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            gap: 5px; margin-top: 6px;
        }
        .shard-item {
            text-align: center; padding: 5px 3px; border-radius: 6px;
            font-size: 10px; font-family: monospace; cursor: default;
        }

        .log-panel {
            background: #1a1a2e; color: #e0e0e0;
            border-radius: 0;
            font-family: 'SF Mono', Monaco, monospace; font-size: 11px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .right-panel > .log-panel:first-child {
            border-radius: 10px 10px 0 0;
        }
        .right-panel > .log-panel:last-child {
            border-radius: 0 0 10px 10px;
        }
        .right-panel > .log-panel:only-child {
            border-radius: 10px;
        }
        .log-drag-handle {
            height: 6px;
            background: #2a2a4a;
            cursor: row-resize;
            flex-shrink: 0;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            position: relative;
        }
        .log-drag-handle:hover {
            background: #3a3a5a;
        }
        .log-drag-handle::after {
            content: '···';
            color: #66779a;
            font-size: 10px;
            letter-spacing: 3px;
            line-height: 1;
        }
        .log-panel-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 14px; background: #16213e; border-bottom: 1px solid #0f3460;
            cursor: pointer; user-select: none;
            flex-shrink: 0;
        }
        .log-panel-header .title { font-weight: 600; font-size: 13px; color: #667eea; }
        .log-panel-header .toggle { font-size: 11px; color: #888; }
        .log-panel-area {
            padding: 6px 14px;
            flex: 1;
            overflow-y: auto;
            scrollbar-gutter: stable;
            line-height: 1.6;
            min-height: 60px;
        }
        .log-panel-area::-webkit-scrollbar {
            width: 8px;
        }
        .log-panel-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .log-panel-area::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
        }
        .log-panel-area::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.25);
        }
        .log-panel-area .log-time { color: #888; }
        .log-panel-area .log-ok { color: #52c41a; }
        .log-panel-area .log-err { color: #ff4d4f; }
        .log-panel-area .log-warn { color: #d48806; }
        .log-panel-area .log-info { color: #1890ff; }
        .log-panel-area .log-shard { color: #f6d365; }

        .toggle-switch {
            position: relative; display: inline-block;
            width: 36px; height: 20px; cursor: pointer;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: #ccc; border-radius: 20px;
            transition: background 0.3s;
        }
        .toggle-slider::before {
            content: ''; position: absolute; left: 2px; bottom: 2px;
            width: 16px; height: 16px; background: white; border-radius: 50%;
            transition: transform 0.3s;
        }
        .toggle-switch input:checked + .toggle-slider { background: #ff4d4f; }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(16px); }

        .get-result {
            background: #f0f5ff; border: 1px solid #d6e4ff; border-radius: 6px;
            padding: 6px 10px; font-size: 11px; font-family: monospace;
        }

        .kv-panel { display: flex; flex-direction: column; gap: 5px; }
        .kv-row { display: flex; gap: 5px; align-items: stretch; }
        .kv-row .kv-inputs {
            flex: 1 1 0; display: flex; gap: 5px; min-width: 0;
        }
        .kv-row .kv-inputs input,
        .kv-row .kv-inputs select {
            flex: 1 1 0; min-width: 0; padding: 7px 10px;
            border: 1px solid #d9d9d9; border-radius: 6px;
            font-size: 12px; outline: none; transition: border-color 0.2s;
        }
        .kv-row .kv-inputs input:focus,
        .kv-row .kv-inputs select:focus {
            border-color: #667eea; box-shadow: 0 0 0 2px rgba(102,126,234,0.15);
        }
        .kv-row .kv-inputs .kv-input-sm { flex: 0 0 70px; min-width: 65px; }
        .kv-row .kv-actions { flex: 0 0 auto; display: flex; gap: 5px; }
        .kv-row .kv-actions .btn { height: 100%; display: flex; align-items: center; font-size: 12px; }

        /* slider 容器统一样式，含 disabled 态 */
        .slider-container {
            border: 1px solid #e8e8e8;
            border-radius: 6px;
            padding: 6px 8px;
            background: white;
            transition: opacity 0.25s, border-color 0.25s, background-color 0.25s;
        }
        .slider-container.disabled {
            opacity: 0.5;
            border-color: #e0e0e0;
            background: #fafafa;
        }
        .slider-container.disabled input[type="range"] {
            accent-color: #ccc;
        }
        .slider-container.disabled .slider-title {
            color: #bbb !important;
        }
        .slider-container.disabled .slider-value {
            color: #bbb !important;
        }

        .chaos-btn {
            font-size: 10px; padding: 2px 8px; border-radius: 10px;
            border: none; cursor: pointer; font-weight: 500;
            transition: all 0.2s; white-space: nowrap;
        }
        .chaos-btn.active { background: #ff4d4f; color: white; }
        .chaos-btn.active:hover { background: #e04345; }
        .chaos-btn.inactive { background: #e8e8e8; color: #999; }
        .chaos-btn.inactive:hover { background: #d9d9d9; color: #666; }
        .chaos-btn.loading { background: #faad14; color: white; }

        .form-label {
            font-size: 11px; color: #888; min-width: 30px;
        }

        .btn-isolate { background: #fffbe6; color: #d48806; border: 1px solid #ffe58f; }
        .btn-isolate:hover { background: #fff1b8; }
        .btn-recover { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
        .btn-recover:hover { background: #d9f7be; }

        .control-row {
            display: flex; gap: 12px;
        }
        .control-col {
            flex: 1; min-width: 0;
            display: flex; flex-direction: column; gap: 6px;
        }

        .sep-line {
            border-top: 1px solid #e8e8e8;
            margin: 6px 0;
        }

        .net-toggle-row {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px;
        }
        .net-toggle-row .left { display: flex; align-items: center; gap: 6px; flex: 1; }
        .net-toggle-row .right { display: flex; align-items: center; gap: 6px; }

        @media (max-width: 1100px) {
            .control-row { flex-direction: column; }
            .control-col { min-width: 0; }
        }

        @media (max-width: 1024px) {
            .container { flex-direction: column; height: auto; }
            .main-panel, .right-panel { width: 100%; min-width: auto; }
            .right-panel { height: 300px; }
        }
    </style>
</head>
<body>
<div class="header">
    <div>
        <h1>ShardKV 集群控制台</h1>
        <div class="subtitle">分布式键值存储系统 · 实时监控与运维</div>
    </div>
    <div class="status-badge">
        <span class="badge-dot"></span>
        <span id="clusterStatus">运行中</span>
        <span id="configNum" style="margin-left:8px;opacity:0.7;"></span>
    </div>
</div>

<div class="container">
    <!-- 左主面板 -->
    <div class="main-panel">

        <!-- 控制操作 -->
        <div class="card">
            <h3>控制操作</h3>
            <div class="control-row">
                <!-- 左列：KV 操作 -->
                <div class="control-col">
                    <div style="font-size:12px;font-weight:600;margin-bottom:4px;color:#667eea;">KV 操作 <span id="kvShard" style="font-size:11px;font-weight:400;color:#888;"></span></div>
                    <div class="kv-panel">
                        <div class="kv-row" style="gap:8px;">
                            <!-- Put 组 -->
                            <div style="display:flex;gap:4px;flex:2;min-width:0;align-items:stretch;">
                                <input type="text" id="putKey" placeholder="键 Key" oninput="kvShardHint()" style="flex:1;min-width:0;padding:7px 12px;">
                                <input type="text" id="putVal" placeholder="值 Value" style="flex:0.7;min-width:0;padding:7px 12px;">
                                <button class="btn btn-primary" onclick="doPut()" style="flex:0 0 auto;">Put</button>
                            </div>
                            <!-- 分隔 -->
                            <div style="width:1px;background:#d9d9d9;flex-shrink:0;"></div>
                            <!-- Get 组 -->
                            <div style="display:flex;gap:4px;flex:1;min-width:0;align-items:stretch;">
                                <input type="text" id="getKey" placeholder="键 Key" oninput="kvShardHint()" style="flex:1;min-width:0;padding:7px 12px;">
                                <button class="btn btn-success" onclick="doGet()" style="flex:0 0 auto;">Get</button>
                            </div>
                        </div>
                        <div class="kv-row" style="padding-top:3px;border-top:1px dashed #e8e8e8;">
                            <span style="font-size:11px;font-weight:600;color:#555;flex-shrink:0;display:flex;align-items:center;">随机生成键值对</span>
                            <div class="kv-inputs" style="flex:0 0 auto;margin-left:auto;">
                                <select id="targetShard" class="kv-input-sm" style="flex:0 0 auto;width:auto;"></select>
                            </div>
                            <div class="kv-actions">
                                <button class="btn btn-sm btn-warning" onclick="generateKeyForShard()">生成</button>
                            </div>
                        </div>
                    </div>
                    <div id="kvResult" class="get-result">等待操作...</div>

                    <!-- CAS 并发竞赛 -->
                    <div class="sep-line"></div>
                    <div style="font-size:12px;font-weight:600;margin-bottom:4px;color:#764ba2;">
                        CAS 并发竞争写入
                    </div>
                    <div class="kv-panel">
                        <div class="kv-row">
                            <div class="kv-inputs">
                                <input type="text" id="raceKey" placeholder="键 Key">
                                <span style="display:flex;align-items:center;font-size:11px;color:#888;white-space:nowrap;flex-shrink:0;padding:0 2px;">客户端数:</span>
                                <input type="number" id="raceNClient" value="5" min="1" max="1000" style="flex:0 0 70px;min-width:60px;">
                            </div>
                            <div class="kv-actions">
                                <button class="btn btn-primary" onclick="doCasRace()">开始</button>
                            </div>
                        </div>
                    </div>
                    <div id="raceResult" class="get-result" style="margin-top:4px;background:#f9f0ff;border-color:#d3adf7;display:none;"></div>

                    <!-- 批量随机写入 -->
                    <div class="sep-line"></div>
                    <div style="font-size:12px;font-weight:600;margin-bottom:4px;color:#52c41a;">
                        批量随机写入
                    </div>
                    <div class="kv-panel">
                        <div class="kv-row">
                            <div class="kv-inputs">
                                <input type="number" id="batchCount" value="100" min="1" max="10000" style="flex:0 0 80px;min-width:60px;">
                                <span style="display:flex;align-items:center;font-size:11px;color:#888;white-space:nowrap;flex-shrink:0;padding:0 2px;">个 key, 来自 </span>
                                <select id="batchShard" class="kv-input-sm">
                                    <option value="-1">任意</option>
                                </select>
                                <span style="display:flex;align-items:center;font-size:11px;color:#888;white-space:nowrap;flex-shrink:0;padding:0 2px;">分片</span>
                            </div>
                            <div class="kv-actions">
                                <button class="btn btn-success" style="flex:0 0 auto;" onclick="doBatchPut()">开始</button>
                            </div>
                        </div>
                    </div>
                    <div id="batchResult" class="get-result" style="margin-top:4px;background:#f6ffed;border-color:#b7eb8f;display:none;"></div>
                </div>

                <!-- 右列：组操作 + 网络可靠性 + 观测日志 -->
                <div class="control-col">
                    <!-- 组操作（含 Start/Kill/Leave 以及添加新组） -->
                    <div>
                        <div style="font-size:12px;font-weight:600;margin-bottom:4px;color:#faad14;">组操作</div>
                        <div style="display:flex;flex-direction:column;gap:4px;">
                            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                                <span class="form-label" style="min-width:30px;">组:</span>
                                <select id="groupGid" class="dropdown" style="flex:1;min-width:80px;">
                                    <option value="">选择组</option>
                                </select>
                                <button class="btn btn-success btn-sm" onclick="doStartGroup()">Start</button>
                                <button class="btn btn-danger btn-sm" onclick="doKillGroup()">Kill</button>
                                <button class="btn btn-warning btn-sm" onclick="doLeaveGroup()">Leave</button>
                                <span style="width:1px;height:18px;background:#d9d9d9;flex-shrink:0;margin:0 2px;"></span>
                                <button class="btn btn-primary btn-sm" onclick="doJoinGroup()">+ 添加新组</button>
                            </div>
                        </div>
                    </div>

                    <!-- 网络参数区域 -->
                    <div class="sep-line"></div>
                    <div style="font-size:12px;font-weight:600;margin-bottom:6px;color:#ff4d4f;">
                        不可靠网络
                        <label class="toggle-switch" style="vertical-align:middle;margin-left:8px;">
                            <input type="checkbox" id="unreliableToggle" onchange="toggleUnreliable()">
                            <span class="toggle-slider"></span>
                        </label>
                        <span id="unreliableLabel" style="font-size:11px;color:#999;vertical-align:middle;"> 关闭 </span>
                    </div>



                        <!-- 丢包率 -->
                        <div class="slider-container">
                            <div class="slider-title" style="font-size:11px;font-weight:600;color:#555;margin-bottom:4px;">丢包率 <span style="font-weight:400;font-size:10px;color:#999;">(RPC 请求/回复)</span></div>
                            <div style="display:flex;align-items:center;gap:6px;">
                                <input type="range" id="dropRateSlider" min="0" max="1000" value="100"
                                    oninput="updateNetParamLabel('dropRate', this.value)"
                                    onchange="commitNetParam('dropRate', this.value)"
                                    style="flex:1;height:4px;cursor:pointer;">
                                <span id="dropRateLabel" class="slider-value" style="width:30px;text-align:right;flex-shrink:0;font-size:11px;color:#333;">10%</span>
                            </div>
                        </div>

                        <!-- RPC 请求延迟 和 RPC 回复乱序 并排 -->
                        <div style="display:flex;gap:8px;">
                            <!-- RPC 请求延迟 -->
                            <div class="slider-container" style="flex:1;min-width:0;">
                                <div class="slider-title" style="font-size:11px;font-weight:600;color:#555;margin-bottom:4px;">RPC 请求延迟</div>
                                <div style="display:flex;align-items:center;gap:6px;">
                                    <input type="range" id="shortDelaySlider" min="0" max="500" value="27"
                                        oninput="updateNetParamLabel('shortDelayMs', this.value)"
                                        onchange="commitNetParam('shortDelayMs', this.value)"
                                        style="flex:1;height:4px;cursor:pointer;">
                                    <span id="shortDelayLabel" class="slider-value" style="width:55px;text-align:right;flex-shrink:0;font-size:11px;color:#333;">0~27ms</span>
                                </div>
                            </div>

                            <!-- RPC 回复乱序 -->
                            <div class="slider-container" style="flex:0 1 auto;min-width:0;padding:9px 12px;">
                                <div class="slider-title" style="font-size:11px;font-weight:600;color:#555;margin-bottom:4px;">RPC 回复乱序</div>
                                <div style="display:flex;align-items:center;gap:6px;">
                                    <label class="toggle-switch" style="vertical-align:middle;">
                                        <input type="checkbox" id="longReorderingToggle" onchange="toggleLongReordering()">
                                        <span class="toggle-slider"></span>
                                    </label>
                                    <span id="longReorderingLabel" class="slider-value" style="font-size:11px;color:#333;white-space:nowrap;">关闭</span>
                                </div>
                            </div>
                        </div>

                        <!-- RPC 不可达超时 -->
                        <div class="slider-container">
                            <div class="slider-title" style="font-size:11px;font-weight:600;color:#555;margin-bottom:4px;">RPC 不可达超时 <span style="font-weight:400;font-size:10px;color:#999;">(节点隔离/停机时生效)</span></div>
                            <div style="display:flex;align-items:center;gap:6px;">
                                <input type="range" id="longDelaySlider" min="100" max="10000" value="7000"
                                    oninput="updateNetParamLabel('longDelayMs', this.value)"
                                    onchange="commitNetParam('longDelayMs', this.value)"
                                    style="flex:1;height:4px;cursor:pointer;">
                                <span id="longDelayLabel" class="slider-value" style="width:65px;text-align:right;flex-shrink:0;font-size:11px;color:#333;">0~7000ms</span>
                            </div>
                        </div>

                    <!-- 观测日志开关 -->
                    <div class="sep-line"></div>
                    <div style="font-size:12px;font-weight:600;margin-bottom:4px;color:#13c2c2;">观测日志</div>
                    <div style="display:flex;flex-wrap:wrap;gap:6px;">
                        <label style="display:flex;align-items:center;gap:4px;font-size:11px;cursor:pointer;padding:3px 8px;border-radius:4px;background:#f0f5ff;border:1px solid #d6e4ff;">
                            <input type="checkbox" class="observe-toggle" data-scene="election" onchange="toggleObserve(this)">
                            <span style="color:#667eea;">Raft选举</span>
                        </label>
                        <label style="display:flex;align-items:center;gap:4px;font-size:11px;cursor:pointer;padding:3px 8px;border-radius:4px;background:#f6ffed;border:1px solid #b7eb8f;">
                            <input type="checkbox" class="observe-toggle" data-scene="kvsubmit" onchange="toggleObserve(this)">
                            <span style="color:#52c41a;">KV操作</span>
                        </label>
                        <label style="display:flex;align-items:center;gap:4px;font-size:11px;cursor:pointer;padding:3px 8px;border-radius:4px;background:#fff7e6;border:1px solid #ffd591;">
                            <input type="checkbox" class="observe-toggle" data-scene="migration" onchange="toggleObserve(this)">
                            <span style="color:#d48806;">分片迁移</span>
                        </label>
                        <label style="display:flex;align-items:center;gap:4px;font-size:11px;cursor:pointer;padding:3px 8px;border-radius:4px;background:#fff2f0;border:1px solid #ffccc7;">
                            <input type="checkbox" class="observe-toggle" data-scene="fault" onchange="toggleObserve(this)">
                            <span style="color:#ff4d4f;">故障恢复</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- 节点状态 -->
        <div class="card">
            <h3>
                <span style="display:flex;align-items:center;">
                    节点状态
                    <button class="btn btn-primary btn-sm" style="margin-left:20px;" onclick="doJoinGroup()">+ 添加新组</button>
                </span>
                <span id="refreshInfo" style="flex:1;text-align:center;font-weight:400;font-size:11px;color:#888;"></span>
                <span class="actions" style="flex-shrink:0;width:150px;justify-content:flex-end;">
                    <span id="pendingMigrationBadge" style="visibility:hidden;padding:2px 8px;border-radius:10px;font-size:11px;background:#fff3cd;color:#856404;border:1px solid #ffeeba;" title="当前有未完成的分片迁移">
                        ⚠ 分片迁移未完成
                    </span>
                </span>
            </h3>
            <div id="nodeStatus" class="node-grid">
                <div style="color:#888;text-align:center;width:100%;padding:20px;">正在加载...</div>
            </div>
        </div>

        <!-- 分片分布 -->
        <div class="card">
            <h3>分片分布 <span id="shardInfo" style="font-weight:400;font-size:11px;color:#888;"></span></h3>
            <div id="shardGrid" class="shard-grid">
                <div style="color:#888;text-align:center;width:100%;padding:10px;">正在加载...</div>
            </div>
        </div>
    </div>

    <!-- 右侧面板：日志 -->
    <div class="right-panel">
        <div class="log-panel" id="opLogPanel">
            <div class="log-panel-header" onclick="toggleLog()">
                <span class="title">操作日志</span>
                <span class="toggle" id="logToggle">收起</span>
            </div>
            <div id="logArea" class="log-panel-area">
                <div class="log-info">系统就绪，等待操作...</div>
            </div>
        </div>
        <div class="log-drag-handle" id="logDragHandle"></div>
        <!-- 观测日志面板 -->
        <div class="log-panel" id="obsLogPanel">
            <div class="log-panel-header" onclick="toggleObserveLog()">
                <span class="title" style="color:#13c2c2;">观测日志</span>
                <span class="toggle" id="observeLogToggle">展开</span>
            </div>
            <div id="observeLogArea" class="log-panel-area" style="display:none;">
                <!-- 初始收起，对应的 toggle 文本要和 observeLogExpanded=false 一致 -->
                <div class="log-info" style="color:#888;">开启观测开关后，日志将在此显示...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const API = '';
    let logCount = 0;
    const N_SHARDS = 12;
    let cachedTree = null;
    let chaosStates = {};
    // 前端乐观 pending 标记：点击 Join/Leave 后立即显示 pending，不等后端响应
    let optimisticPendingMigration = false;

    function key2Shard(key) {
        let hash = 0x811c9dc5 >>> 0;
        for (let i = 0; i < key.length; i++) {
            hash ^= key.charCodeAt(i);
            hash = Math.imul(hash, 0x01000193) >>> 0;
        }
        return (hash % N_SHARDS) >>> 0;
    }

    function shardHint(key) {
        if (!key) return '';
        const s = key2Shard(key);
        return `分片${s}`;
    }

    function kvShardHint() {
        const putKey = document.getElementById('putKey').value.trim();
        const getKey = document.getElementById('getKey').value.trim();
        const activeKey = putKey || getKey;
        document.getElementById('kvShard').textContent = activeKey ? `-> ${shardHint(activeKey)}` : '';
    }


    // 状态刷新退避：失败后逐步延长刷新间隔，成功后立即恢复
    let refreshFailCount = 0;
    let refreshTimer = null;

    let logExpanded = true;
    let observeLogExpanded = false;
    const INITIAL_LOG_RATIO = 0.6;
    let logRatio = INITIAL_LOG_RATIO;
    function toggleLog() {
        const area = document.getElementById('logArea');
        const toggle = document.getElementById('logToggle');
        logExpanded = !logExpanded;
        area.style.display = logExpanded ? 'block' : 'none';
        toggle.textContent = logExpanded ? '收起' : '展开';
        recalculateLogLayout();
    }

    /**
     * recalculateLogLayout 根据两个日志面板的展开/收起状态，
     * 动态调整它们在 .right-panel 中的 flex 比例：
     * - 两个都展开：操作日志 flex:1，观测日志固定 200px
     * - 只有操作日志展开：操作日志 flex:1，观测日志 flex:0 0 auto
     * - 只有观测日志展开：操作日志 flex:0 0 auto，观测日志 flex:1
     * - 全部收起：都 flex:0 0 auto，背景统一深色
     */
    logRatio = INITIAL_LOG_RATIO;
    function recalculateLogLayout() {
        const opPanel = document.getElementById('opLogPanel');
        const obsPanel = document.getElementById('obsLogPanel');
        const handle = document.getElementById('logDragHandle');
        if (!opPanel || !obsPanel) return;

        const bothExpanded = logExpanded && observeLogExpanded;

        if (handle) {
            handle.style.display = bothExpanded ? 'flex' : 'none';
        }

        if (bothExpanded) {
            // 两个都展开，按 logRatio 比例分配
            const obsRatio = 1 - logRatio;
            opPanel.style.flex = String(logRatio);
            opPanel.style.maxHeight = 'none';
            obsPanel.style.flex = String(obsRatio);
            obsPanel.style.maxHeight = 'none';
        } else if (logExpanded && !observeLogExpanded) {
            // 仅操作日志展开
            opPanel.style.flex = '1';
            opPanel.style.maxHeight = 'none';
            obsPanel.style.flex = '0 0 auto';
            obsPanel.style.maxHeight = 'none';
        } else if (!logExpanded && observeLogExpanded) {
            // 仅观测日志展开
            opPanel.style.flex = '0 0 auto';
            opPanel.style.maxHeight = 'none';
            obsPanel.style.flex = '1';
            obsPanel.style.maxHeight = 'none';
        } else {
            // 全部收起
            opPanel.style.flex = '0 0 auto';
            opPanel.style.maxHeight = 'none';
            obsPanel.style.flex = '0 0 auto';
            obsPanel.style.maxHeight = 'none';
        }
    }

    // ========== 拖拽分隔条 ==========
    let isDragging = false;
    let dragStartY = 0;
    let dragStartRatio = 0.6;

    function initDragHandle() {
        const handle = document.getElementById('logDragHandle');
        if (!handle) return;
        handle.addEventListener('mousedown', onDragStart);
    }

    function onDragStart(e) {
        isDragging = true;
        dragStartY = e.clientY;
        dragStartRatio = logRatio;
        document.body.style.cursor = 'row-resize';
        document.body.style.userSelect = 'none';
        document.addEventListener('mousemove', onDragMove);
        document.addEventListener('mouseup', onDragEnd);
        e.preventDefault();
    }

    function onDragMove(e) {
        if (!isDragging) return;
        const rightPanel = document.querySelector('.right-panel');
        if (!rightPanel) return;
        const rect = rightPanel.getBoundingClientRect();
        const panelHeight = rect.height;
        if (panelHeight <= 0) return;

        const deltaY = e.clientY - dragStartY;
        const deltaRatio = deltaY / panelHeight;
        let newRatio = dragStartRatio + deltaRatio;
        newRatio = Math.max(0.15, Math.min(0.85, newRatio));
        logRatio = newRatio;
        recalculateLogLayout();
    }

    function onDragEnd() {
        isDragging = false;
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        document.removeEventListener('mousemove', onDragMove);
        document.removeEventListener('mouseup', onDragEnd);
    }

    // 页面加载后初始化拖拽
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initDragHandle);
    } else {
        initDragHandle();
    }

    function addLog(message, type) {
        const logArea = document.getElementById('logArea');
        const time = new Date().toLocaleTimeString();
        const cls = type === 'ok' ? 'log-ok' : type === 'err' ? 'log-err' : type === 'warn' ? 'log-warn' : type === 'shard' ? 'log-shard' : 'log-info';
        const entry = document.createElement('div');
        entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="${cls}">${message}</span>`;
        logArea.appendChild(entry);
        logArea.scrollTop = logArea.scrollHeight;
        logCount++;
        while (logArea.children.length > 200) {
            logArea.removeChild(logArea.firstChild);
        }
    }

    async function api(path, options, timeoutMs, silent) {
        timeoutMs = timeoutMs || 15000;

        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
            const resp = await fetch(API + path, {
                headers: {'Content-Type': 'application/json'},
                signal: controller.signal,
                ...options
            });
            clearTimeout(timer);
            if (!resp.ok) {
                const text = await resp.text();
                throw new Error(`HTTP ${resp.status}: ${text}`);
            }
            return await resp.json();
        } catch (err) {
            clearTimeout(timer);
            if (!silent) {
                if (err.name === 'AbortError') {
                    addLog(`请求等待超时: ${path} (超过 ${timeoutMs/1000}s 无响应，后端可能仍在处理)`, 'err');
                } else {
                    addLog(`API 错误: ${err.message}`, 'err');
                }
            }
            throw err;
        }
    }


    function randomChars(n) {
        const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
        let result = '';
        for (let i = 0; i < n; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
        return result;
    }

    // ========== Key 池（预生成随机 key，按分片索引） ==========
    const POOL_MAX_TOTAL = 2000;     // 最多生成 2000 个 key
    const POOL_MIN_PER_SHARD = 100;  // 每个分片至少 100 个
    let keyPool = {};                // { 0: [...], 1: [...], ..., 11: [...] }
    let keyPoolReady = false;        // 标记池子是否已就绪

    function generateKeyPool() {
        keyPoolReady = false;
        for (let s = 0; s < N_SHARDS; s++) keyPool[s] = [];

        let total = 0;
        while (total < POOL_MAX_TOTAL) {
            // 检查是否所有分片都 >= POOL_MIN_PER_SHARD
            let allEnough = true;
            for (let s = 0; s < N_SHARDS; s++) {
                if (keyPool[s].length < POOL_MIN_PER_SHARD) {
                    allEnough = false;
                    break;
                }
            }
            if (allEnough) break;  // 每个池子至少 100 个，退出

            const key = randomChars(8);
            const shard = key2Shard(key);
            keyPool[shard].push(key);
            total++;
        }

        keyPoolReady = true;
    }

    function generateKeyForShard() {
        if (!keyPoolReady) {
            addLog('准备中，请稍后重试...', 'warn');
            return;
        }
        const target = parseInt(document.getElementById('targetShard').value);
        const pool = keyPool[target];
        if (!pool || pool.length === 0) return;
        const idx = Math.floor(Math.random() * pool.length);
        const key = pool[idx];
        const val = randomChars(3);
        document.getElementById('putKey').value = key;
        document.getElementById('getKey').value = key;
        document.getElementById('putVal').value = val;
        kvShardHint();
        addLog(`已填入随机键值对 "${key}":"${val}" -> 分片 ${target}`, 'info');
    }

    // ========== KV 操作 ==========
    async function doPut() {
        const key = document.getElementById('putKey').value.trim();
        const value = document.getElementById('putVal').value.trim();
        if (!key) { addLog('Put: 键不能为空', 'err'); return; }
        const shard = key2Shard(key);
        const result = await api('/api/kv/', {
            method: 'PUT',
            body: JSON.stringify({key, value})
        });
        document.getElementById('kvResult').textContent =
            result.success
                ? `Put: ${key} = ${value} (分片 ${shard}, reqVer = ${result.reqVer})`
                : `Put 失败: ${result.err || 'unknown error'} (分片 ${shard}, reqVer = ${result.reqVer})`;
        if (result.success) {
            addLog(`Put key="${key}" value="${value}" (分片 ${shard}, version = ${result.reqVer})`, 'ok');
        } else {
            addLog(`Put key="${key}" value="${value}" 失败 ${result.err} (分片 ${shard}, version = ${result.reqVer})`, 'err');
        }

        document.getElementById('putVal').value = randomChars(3);
        refreshStatus();
    }

    async function doGet() {
        const key = document.getElementById('getKey').value.trim();
        if (!key) { addLog('Get: 键不能为空', 'err'); return; }
        const shard = key2Shard(key);
        const result = await api('/api/kv/' + encodeURIComponent(key), {method: 'GET'});
        document.getElementById('kvResult').textContent =
            result.success
                ? `Get: ${key} = "${result.value}" (分片 ${shard}, v${result.version})`
                : `Get 失败: ${result.err || 'unknown error'} (分片 ${shard})`;
        if (result.success) {
            addLog(`Get key="${key}" -> "${result.value}" (分片 ${shard}, v${result.version})`, 'ok');
        } else {
            addLog(`Get key="${key}" 失败 ${result.err || 'unknown error'} (分片 ${shard})`, 'err');
        }
    }

    // ========== 节点操作 ==========
    // 节点操作在节点状态中通过按钮直接调用 doKillNodeById / doStartNodeById

    // ========== 网络操作 ==========
    async function doIsolateNode(gid, srv) {
        const result = await api('/api/node/isolate', {
            method: 'POST',
            body: JSON.stringify({gid, srv})
        });
        if (result.success) {
            addLog(`IsolateNode: 组 ${gid} 节点 ${srv} 已隔离网络 (进程保持运行)`, 'warn');
        } else {
            addLog(`IsolateNode: 组 ${gid} 节点 ${srv} 隔离失败 - ${result.error}`, 'err');
        }
        refreshStatus();
    }

    async function doRecoverNode(gid, srv) {
        const result = await api('/api/node/recover-node', {
            method: 'POST',
            body: JSON.stringify({gid, srv})
        });
        if (result.success) {
            addLog(`RecoverNode: 组 ${gid} 节点 ${srv} 网络已恢复`, 'ok');
        } else {
            addLog(`RecoverNode: 组 ${gid} 节点 ${srv} 恢复失败 - ${result.error || '未知错误'}`, 'err');
        }
        refreshStatus();
    }

    async function doKillNodeById(gid, srv) {
        await api('/api/node/kill', {method: 'POST', body: JSON.stringify({gid, srv})});
        addLog(`KillNode: server-${gid}-${srv}`, 'err');
        refreshStatus();
    }

    async function doStartNodeById(gid, srv) {
        const result = await api('/api/node/start', {method: 'POST', body: JSON.stringify({gid, srv})});
        if (result.success) {
            addLog(`StartNode: server-${gid}-${srv} 已启动`, 'ok');
        } else {
            addLog(`StartNode: server-${gid}-${srv} 启动失败 - ${result.error || '未知错误'}`, 'err');
        }
        refreshStatus();
    }

    // ========== 组操作 ==========
    async function doKillGroup() {
        const gid = parseInt(document.getElementById('groupGid').value);
        if (isNaN(gid)) { addLog('KillGroup: 请选择有效的组', 'err'); return; }
        await api('/api/group/kill', {method: 'POST', body: JSON.stringify({gid})});
        addLog(`KillGroup: 组 ${gid} 全部 3 个节点已停掉`, 'err');
        refreshStatus();
    }

    async function doStartGroup() {
        const gid = parseInt(document.getElementById('groupGid').value);
        if (isNaN(gid)) { addLog('StartGroup: 请选择有效的组', 'err'); return; }
        const result = await api('/api/group/start', {method: 'POST', body: JSON.stringify({gid})});
        if (result.success) {
            addLog(`StartGroup: 组 ${gid} 全部节点已启动`, 'ok');
        } else {
            addLog(`StartGroup: 组 ${gid} 启动失败 - ${result.error || '未知错误'}`, 'err');
        }
        refreshStatus();
    }

    async function doJoinGroup() {
        addLog(`JoinGroup: ── 发起新组加入操作 ──`, 'shard');
        // 乐观更新：立即显示 pending 标记，不等 POST 返回
        optimisticPendingMigration = true;
        refreshStatus();

        let result;
        try {
            result = await api('/api/group/join', {method: 'POST'});
        } finally {
            optimisticPendingMigration = false; // 异常也清除标记
        }
        if (result.success) {
            if (result.message) {
                addLog(`JoinGroup: ${result.message}`, 'shard');
            }
            addLog(`JoinGroup: ✅ 新组 ${result.gid} 已加入集群，分片迁移完成`, 'shard');
        } else if (result.message) {
            addLog(`JoinGroup: ❌ ${result.message}`, 'err');
        } else {
            addLog(`JoinGroup: ❌ 组加入失败`, 'err');
        }
        refreshStatus();
    }

    let leaveInFlight = false;
    async function doLeaveGroup() {
        if (leaveInFlight) { addLog('LeaveGroup: 上次操作未完成，请等待', 'err'); return; }
        const gid = parseInt(document.getElementById('groupGid').value);
        if (isNaN(gid)) { addLog('LeaveGroup: 请选择有效的组', 'err'); return; }
        if (gid === 0) { addLog('LeaveGroup: ❌ ConfigStore (组 0) 是系统核心组件，不允许离开集群', 'err'); return; }
        leaveInFlight = true;
        addLog(`LeaveGroup: ── 发起组 ${gid} 离开操作 ──`, 'shard');
        optimisticPendingMigration = true;
        refreshStatus();
        let result;
        try {
            result = await api('/api/group/leave', {method: 'POST', body: JSON.stringify({gid})});
        } finally {
            optimisticPendingMigration = false; // 异常也清除标记
        }
        if (result.success) {
            addLog(`LeaveGroup: ✅ 组 ${gid} 已离开集群，分片已迁移到其他组`, 'shard');
        } else if (result.message) {
            addLog(`LeaveGroup: ❌ ${result.message}`, 'err');
        } else {
            addLog(`LeaveGroup: ❌ 组 ${gid} 移除失败`, 'err');
        }
        leaveInFlight = false;
        refreshStatus();
    }


    let netParams = { dropRate: 100, shortDelayMs: 27, longDelayMs: 7000 };
    // 记录关闭不可靠网络时回复乱序的开启状态，用于再次开启时自动恢复
    let savedLongReorderingState = null;

    // 根据不可靠网络 toggle 状态，切换三个 slider 容器的 disabled 样式
    function updateSliderDisabledState(enabled) {
        document.querySelectorAll('.slider-container').forEach(el => {
            if (enabled) {
                el.classList.remove('disabled');
            } else {
                el.classList.add('disabled');
            }
        });
        // 同时同步更新 RPC 回复乱序 checkbox 的 disabled 属性
        const reorderToggle = document.getElementById('longReorderingToggle');
        if (reorderToggle) {
            reorderToggle.disabled = !enabled;
        }
    }

    // oninput: 仅更新标签显示，不触发网络请求
    function updateNetParamLabel(param, value) {
        const intVal = parseInt(value);
        netParams[param] = intVal;

        const labels = {
            dropRate: { el: 'dropRateLabel', fmt: v => (v/10).toFixed(0) + '%' },
            shortDelayMs: { el: 'shortDelayLabel', fmt: v => '0~' + v + 'ms' },
            longDelayMs: { el: 'longDelayLabel', fmt: v => '0~' + v + 'ms' },
        };
        const info = labels[param];
        if (info) {
            document.getElementById(info.el).textContent = info.fmt(intVal);
        }
    }

    // onchange: 用户松手后提交参数到后端并输出日志
    async function commitNetParam(param, value) {
        const intVal = parseInt(value);
        netParams[param] = intVal;

        // 只在不可靠网络开启时提交
        const toggle = document.getElementById('unreliableToggle');
        if (!toggle.checked) return;

        try {
            const result = await api('/api/network/params', {
                method: 'POST',
                body: JSON.stringify({[param]: intVal})
            });
            // if (result && result.success) {
            //     const displayVal = param === 'dropRate'
            //         ? (intVal / 10).toFixed(1) + '%'
            //         : String(intVal) + 'ms';
            //      addLog(`网络参数已设置: ${param} = ${displayVal}`, 'info');
            // }
        } catch (err) {}
    }

    async function toggleUnreliable() {
        const toggle = document.getElementById('unreliableToggle');
        const label = document.getElementById('unreliableLabel');
        // 记录 checkbox 变化前的原始状态，用于失败时回滚
        const origChecked = !toggle.checked;
        const enabled = toggle.checked;
        const origLabelText = origChecked ? '开启 (丢包 + 延迟)' : '关闭';
        const origLabelColor = origChecked ? '#ff4d4f' : '#999';
        try {
            const result = await api('/api/network/reliable', {
                method: 'POST',
                body: JSON.stringify({reliable: !enabled})
            });
            if (!result || !result.success) {
                throw new Error(result ? (result.error || '后端返回失败') : '后端无响应');
            }
        } catch (err) {
            // API 失败：回滚 checkbox 和标签到原始状态
            toggle.checked = origChecked;
            label.textContent = origLabelText;
            label.style.color = origLabelColor;
            addLog(`不可靠网络切换失败: ${err.message}`, 'err');
            return;
        }
        // 成功后才更新标签
        label.textContent = enabled ? '开启 (丢包+延迟)' : '关闭';
        label.style.color = enabled ? '#ff4d4f' : '#999';
        // 同步更新三个 slider 的禁用样式
        updateSliderDisabledState(enabled);
        const dropPct = (netParams.dropRate / 10).toFixed(0);
        addLog(`不可靠网络: ${enabled ? `开启 (丢包率 = ${dropPct}%, RPC请求延迟 = 0~${netParams.shortDelayMs}ms, RPC不可达超时 = 0~${netParams.longDelayMs}ms)` : '关闭'}`, enabled ? 'err' : 'ok');

        // 关闭不可靠网络时：保存回复乱序状态，并一并关闭
        if (!enabled) {
            const reorderToggle = document.getElementById('longReorderingToggle');
            const reorderLabel = document.getElementById('longReorderingLabel');
            savedLongReorderingState = reorderToggle.checked;
            if (savedLongReorderingState) {
                try {
                    const result = await api('/api/network/long-reordering', {
                        method: 'POST',
                        body: JSON.stringify({on: false})
                    });
                    if (result && result.success) {
                        reorderToggle.checked = false;
                        reorderLabel.textContent = '关闭';
                    }
                } catch (err) {}
            }
        }

        // 开启不可靠网络时：如果之前保存的回复乱序状态是开启，则自动恢复
        if (enabled && savedLongReorderingState) {
            const reorderToggle = document.getElementById('longReorderingToggle');
            const reorderLabel = document.getElementById('longReorderingLabel');
            try {
                const result = await api('/api/network/long-reordering', {
                    method: 'POST',
                    body: JSON.stringify({on: true})
                });
                if (result && result.success) {
                    reorderToggle.checked = true;
                    reorderLabel.textContent = '开启';
                }
            } catch (err) {}
        }

        refreshStatus();

        // 开启时立即同步三个参数到后端
        if (enabled) {
            try {
                const result = await api('/api/network/params', {
                    method: 'POST',
                    body: JSON.stringify({
                        dropRate: netParams.dropRate,
                        shortDelayMs: netParams.shortDelayMs,
                        longDelayMs: netParams.longDelayMs
                    })
                });
                // if (result && result.success) {
                //     addLog(`网络参数已同步: 丢包率 = ${result.dropRate/10}% | RPC请求延迟 = 0~${result.shortDelayMs}ms | 断线超时延迟 = 0~${result.longDelayMs}ms`, 'info');
                // }
            } catch (err) {}
        }
    }

    async function toggleLongReordering() {
        const toggle = document.getElementById('longReorderingToggle');
        const label = document.getElementById('longReorderingLabel');
        const on = toggle.checked;
        // 不可靠网络关闭时禁止操作回复乱序
        if (!document.getElementById('unreliableToggle').checked) {
            if (on) {
                toggle.checked = false;
                addLog('回复乱序: 不可靠网络关闭时无法开启', 'warn');
            }
            return;
        }
        try {
            const result = await api('/api/network/long-reordering', {
                method: 'POST',
                body: JSON.stringify({on})
            });
            if (result.success) {
                label.textContent = on ? '开启' : '关闭';
                addLog(`回复乱序: ${on ? '开启 (RPC 回复有 2/3 概率延迟 200 ~ 2200ms)' : '关闭'}`, on ? 'err' : 'info');
                // 开启回复乱序时会自动开启不可靠网络 + 长延迟，所以同时更新不可靠 toggle 状态
                if (on) {
                    document.getElementById('unreliableToggle').checked = true;
                    document.getElementById('unreliableLabel').textContent = '开启 (丢包+延迟)';
                    document.getElementById('unreliableLabel').style.color = '#ff4d4f';
                }
            } else {
                toggle.checked = !on;
                addLog(`回复乱序设置失败`, 'err');
            }
        } catch (err) {
            toggle.checked = !on;
        }
    }

    // ========== 快捷 Leave（从节点状态标题调用） ==========
    async function doLeaveGroupById(gid) {
        if (gid === 0) { addLog('LeaveGroup: ❌ ConfigStore (组 0) 是系统核心组件，不允许离开集群', 'err'); return; }
        addLog(`LeaveGroup: ── 发起组 ${gid} 离开操作 ──`, 'shard');
        optimisticPendingMigration = true;
        refreshStatus();
        let result;
        try {
            result = await api('/api/group/leave', {method: 'POST', body: JSON.stringify({gid})});
        } finally {
            optimisticPendingMigration = false; // 异常也清除标记
        }
        if (result.success) {
            addLog(`LeaveGroup: 组 ${gid} 已离开集群，分片已迁移到其他组`, 'shard');
        } else if (result.message) {
            addLog(`LeaveGroup: ${result.message}`, 'err');
        } else {
            addLog(`LeaveGroup: 组 ${gid} 移除失败`, 'err');
        }
        refreshStatus();
    }

    // ========== 混沌猴子 ==========
    async function toggleChaos(gid) {
        const btn = document.getElementById('chaosBtn_' + gid);
        if (!btn) return;
        const currentlyActive = chaosStates[gid];
        const path = currentlyActive ? '/api/chaos/stop' : '/api/chaos/start';
        btn.className = 'chaos-btn loading';
        btn.textContent = '处理中...';
        try {
            const result = await api(path, {method: 'POST', body: JSON.stringify({gid})});
            if (result.success) {
                chaosStates[gid] = !currentlyActive;
                if (chaosStates[gid]) {
                    addLog(`混沌: 组 ${gid} 已启动，每 1-3s 随机kill节点，但会保证大多数节点在线`, 'err');
                } else {
                    addLog(`混沌: 组 ${gid} 已停止`, 'ok');
                }
            } else {
                addLog(`混沌: 组 ${gid} 操作失败 - ${result.error || '未知错误'}`, 'err');
            }
        } catch (err) {}
        refreshStatus();
    }

    async function fetchChaosStatus() {
        try {
            const result = await api('/api/chaos/status', {method: 'GET'}, 15000, true);
            if (result.success && result.states) {
                const newChaos = {};
                for (const s of result.states) newChaos[s.gid] = s.active;
                chaosStates = newChaos;
            }
        } catch (err) {}
    }


    // ========== 渲染 ==========
    const COLORS = [
        '#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe',
        '#43e97b', '#fa709a', '#f6d365', '#a18cd1', '#fbc2eb',
        '#84fab0', '#8fd3f4', '#a6c1ee', '#fccb90', '#d57eeb',
    ];

    function getGroupColor(gid) {
        return COLORS[(gid) % COLORS.length];
    }

    function getNodeStatus(srv) {
        if (!srv.isAlive) return 'dead';
        if (srv.isIsolated && srv.isLeader) return 'leader-isolated';
        if (srv.isIsolated) return 'isolated';
        if (srv.isLeader) return 'leader';
        return 'alive';
    }

    function getNodeStatusText(srv) {
        if (!srv.isAlive) return '离线';
        if (srv.isIsolated && srv.isLeader) return 'Leader  隔离';
        if (srv.isIsolated) return '隔离';
        if (srv.isLeader) return 'Leader  在线';
        return '在线';
    }

    function populateGroupSelect(groups) {
        const sel = document.getElementById('groupGid');
        const currentVal = sel.value;
        const frag = document.createDocumentFragment();
        frag.appendChild(new Option('选择组', ''));
        for (const g of groups) {
            const label = g.gid === 0 ? `ConfigStore (${g.nShards} 分片)` : `组 ${g.gid} (${g.nShards} 分片)`;
            frag.appendChild(new Option(label, String(g.gid)));
        }
        sel.innerHTML = '';
        sel.appendChild(frag);
        if (currentVal && [...sel.options].some(o => o.value === currentVal)) {
            sel.value = currentVal;
        }
    }

    // ========== 增强版 renderNodeStatus（集成网络操作） ==========
    function renderNodeStatus(tree) {
        const statusPanel = document.getElementById('nodeStatus');
        if (!tree.groups || tree.groups.length === 0) {
            statusPanel.innerHTML = '<div style="color:#888;text-align:center;width:100%;padding:20px;">无活跃组</div>';
            return;
        }
        const sortedGroups = [...tree.groups].sort((a, b) => a.gid - b.gid);
        let html = '';
        for (const group of sortedGroups) {
            const color = getGroupColor(group.gid);
            const aliveCount = group.servers.filter(s => s.isAlive && !s.isIsolated).length;
            const chaosActive = (chaosStates && chaosStates[group.gid]);
            const chaosBtnClass = chaosActive ? 'chaos-btn active' : 'chaos-btn inactive';
            const chaosBtnText = chaosActive ? '混沌中' : '混沌';
            html += `
                <div class="group-card" style="border-left: 3px solid ${color};">
                    <div class="group-header">
                        <span class="gid" style="color:${color};">${group.gid === 0 ? '配置仓库' : `组 ${group.gid}`} ${group.gid === 0 ? '' : `<span style="font-weight:400;font-size:11px;color:#888;">(${group.nShards} 分片)</span>`}</span>
                        <span class="ops">
                            <button class="${chaosBtnClass}" id="chaosBtn_${group.gid}"
                                    onclick="toggleChaos(${group.gid})">${chaosBtnText}</button>
                            ${group.gid === 0 ? '' : `<button class="btn btn-xs btn-warning" onclick="doLeaveGroupById(${group.gid})">Leave</button>`}
                        </span>
                    </div>
            `;
            for (const srv of group.servers) {
                const status = getNodeStatus(srv);
                const statusText = getNodeStatusText(srv);
                // 普通在线节点：显示 隔离 + Kill
                // 隔离节点：显示 恢复 + Start（进程还在）
                // 离线节点：显示 Start
                const isolateBtn = srv.isAlive && !srv.isIsolated
                    ? `<button class="btn btn-xs btn-isolate" onclick="doIsolateNode(${group.gid}, ${srv.index})">隔离</button>`
                    : '';
                const recoverBtn = srv.isAlive && srv.isIsolated
                    ? `<button class="btn btn-xs btn-recover" onclick="doRecoverNode(${group.gid}, ${srv.index})">恢复</button>`
                    : '';
                const killBtn = srv.isAlive
                    ? `<button class="btn btn-xs btn-danger" onclick="doKillNodeById(${group.gid}, ${srv.index})">Kill</button>`
                    : '';
                const startBtn = !srv.isAlive
                    ? `<button class="btn btn-xs btn-success" onclick="doStartNodeById(${group.gid}, ${srv.index})">Start</button>`
                    : '';
                html += `
                    <div class="server-item">
                        <span class="dot ${status}" title="${statusText}"></span>
                        <span class="name">${srv.name}</span>
                        <span class="status-label">${statusText}</span>
                        <span class="actions">
                            ${isolateBtn}${recoverBtn}${killBtn}${startBtn}
                        </span>
                    </div>
                `;
            }
            html += `</div>`;
        }
        statusPanel.innerHTML = html;
    }

    function renderShards(tree) {
        const grid = document.getElementById('shardGrid');

        const info = document.getElementById('shardInfo');
        if (!tree.shards || tree.shards.length === 0) {
            grid.innerHTML = '<div style="color:#888;text-align:center;width:100%;padding:10px;">无分片数据</div>';
            info.textContent = '';
            return;
        }
        info.textContent = `共 ${tree.shards.length} 个分片 · Config #${tree.configNum}`;
        let html = '';
        for (const shard of tree.shards) {
            const color = getGroupColor(shard.gid);
            html += `<div class="shard-item" style="background:${color}22; color:${color}; border:1px solid ${color}44;">
                分片${shard.shard}<br><small>组${shard.gid}</small>
            </div>`;
        }
        grid.innerHTML = html;
    }

    // ========== 刷新（并行超时保护） ==========
    let refreshing = false;
    let usingCache = false; // 标记当前显示的节点状态是否来自缓存
    async function refreshStatus() {
        if (refreshing) return;
        refreshing = true;
        const refreshInfo = document.getElementById('refreshInfo');
        if (!usingCache) {
            refreshInfo.textContent = '刷新中...';
        }
        // 如果正在使用缓存，不显示"刷新中"以免误导用户以为在连接

        // 并行请求，各自独立降级：configStore 死掉不会阻塞节点状态显示
        // 如果已在缓存/离线状态，静默处理网络错误，避免日志刷屏
        const [treeResult, chaosResult] = await Promise.all([
            api('/api/status/tree', {method: 'GET'}, 15000, usingCache).catch(err => {
                if (!usingCache) {
                    addLog('刷新节点状态失败: ' + err.message, 'err');
                }
                return null;
            }),
            fetchChaosStatus().catch(() => {})
        ]);


        const tree = treeResult;

        // 渲染节点状态——即使 tree 为空也显示基础界面，不崩溃
        try {
            if (tree) {
                usingCache = !!tree.configCached;
                if (tree.configCached) {
                    // configStore 无响应，使用缓存数据
                    cachedTree = tree;
                    document.getElementById('configNum').textContent = `Config #${tree.configNum || '?'} (缓存)`;
                    renderNodeStatus(cachedTree);
                    renderShards(cachedTree);
                    if (cachedTree.groups && cachedTree.groups.length > 0) {
                        populateGroupSelect([...cachedTree.groups].sort((a, b) => a.gid - b.gid));
                    }
                    refreshInfo.textContent = '缓存数据 - 配置仓库无响应';
                    refreshFailCount++;
                    return;
                }

                cachedTree = tree;
                document.getElementById('configNum').textContent = `Config #${tree.configNum || '?'}`;
                renderNodeStatus(tree);
                renderShards(tree); // tree.shards 已有完整分片数据
                if (tree.groups && tree.groups.length > 0) {
                    const sortedGroups = [...tree.groups].sort((a, b) => a.gid - b.gid);
                    populateGroupSelect(sortedGroups);

                } else {
                    populateGroupSelect([]);
                }
                // Show/hide pending migration badge
                const pendingBadge = document.getElementById('pendingMigrationBadge');
                if (tree.hasPendingMigration || optimisticPendingMigration) {
                    pendingBadge.style.visibility = 'visible';
                } else {
                    pendingBadge.style.visibility = 'hidden';
                }
                refreshInfo.textContent = `更新于 ${new Date().toLocaleTimeString()}`;
                refreshFailCount = 0; // 成功后重置退避计数
            } else {
                // tree 为 null：configStore 完全挂了，但仍然显示本地缓存的节点状态
                if (cachedTree) {
                    usingCache = true;
                    document.getElementById('configNum').textContent = `Config #${cachedTree.configNum} (缓存)`;
                    renderNodeStatus(cachedTree);
                    renderShards(cachedTree);

                    if (cachedTree.groups && cachedTree.groups.length > 0) {
                        populateGroupSelect([...cachedTree.groups].sort((a, b) => a.gid - b.gid));
                    }
                    refreshInfo.textContent = '缓存数据 - 配置仓库无响应';
                } else {
                    usingCache = false;
                    document.getElementById('configNum').textContent = 'ConfigStore 离线';
                    document.getElementById('nodeStatus').innerHTML =
                        '<div style="color:#ff4d4f;text-align:center;width:100%;padding:20px;">⚠ ConfigStore 离线，节点操作仍然可用</div>';
                    document.getElementById('shardGrid').innerHTML =
                        '<div style="color:#888;text-align:center;width:100%;padding:10px;">ConfigStore 离线，分片分布不可用</div>';
                    refreshInfo.textContent = 'ConfigStore 离线';
                }
                refreshFailCount++; // 连接失败，增加退避计数
            }
        } catch (err) {
            addLog('渲染节点状态异常: ' + err.message, 'err');
            refreshInfo.textContent = '渲染异常';
            refreshFailCount++; // 失败后增加退避计数
        } finally {
            refreshing = false;
        }
    }



    function initShardSelect() {
        const sel = document.getElementById('targetShard');
        const frag = document.createDocumentFragment();
        for (let i = 0; i < N_SHARDS; i++) {
            frag.appendChild(new Option(`分片 ${i}`, String(i)));
        }
        sel.innerHTML = '';
        sel.appendChild(frag);
    }

    function initBatchShardSelect() {
        const sel = document.getElementById('batchShard');
        const frag = document.createDocumentFragment();
        frag.appendChild(new Option('任意', '-1'));
        for (let i = 0; i < N_SHARDS; i++) {
            frag.appendChild(new Option(`分片 ${i}`, String(i)));
        }
        sel.innerHTML = '';
        sel.appendChild(frag);
    }

    // ========== 批量随机写入（含防重发限制）==========
    let batchPutBusy = false; // 前端限制：前一轮未完成时禁止下一轮

    function getBatchBtn() {
        // 查找"开始"按钮：批量随机写入面板内第一个 .btn-success
        const panel = document.querySelector('.kv-panel');
        // 更精确：直接取 batchResult 前一个 panel 中的按钮
        const btn = document.querySelector('#batchResult')
            ?.previousElementSibling?.querySelector('.btn-success');
        return btn || document.querySelector('button[onclick="doBatchPut()"]');
    }

    async function doBatchPut() {
        const btn = getBatchBtn();

        // === 前一轮尚未完成，禁止重发 ===
        if (batchPutBusy) {
            addLog('批量写入已在执行中，请等待完成后重试', 'warn');
            // 视觉抖动提醒
            if (btn) {
                btn.style.animation = 'none';
                void btn.offsetHeight; // 触发回流
                btn.style.animation = 'btn-shake 0.4s ease';
            }
            return;
        }

        const count = parseInt(document.getElementById('batchCount').value) || 100;
        const targetShard = parseInt(document.getElementById('batchShard').value);
        const resultDiv = document.getElementById('batchResult');

        if (count < 1 || count > 10000) {
            addLog('批量写入: 数量必须在 1~10000 之间', 'err');
            return;
        }

        // === 加锁：禁用按钮，禁止下一轮 ===
        batchPutBusy = true;
        if (btn) btn.disabled = true;

        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `<span class="spinner"></span> 写入中 (${count} 个 key, 最多 500 个客户端并发)...`;
        addLog(`批量写入开始: ${count} 个 key, ${targetShard >= 0 ? `分片 ${targetShard}` : '任意分片'}, 并发`, 'shard');

        const startTime = Date.now();

        // 构建请求体
        const body = {count};
        if (targetShard >= 0) body.shard = targetShard;

        try {
            const result = await api('/api/kv/batch-put', {
                method: 'POST',
                body: JSON.stringify(body)
            }, 600000); // 10 分钟超时，因为大批量写入可能很慢

            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
            if (result.success) {
                resultDiv.innerHTML = `<div>成功 <strong>${result.successCount}</strong> / 失败 <strong>${result.failCount}</strong> | 用时 ${elapsed}s</div>`;
                addLog(`批量写入完成: 成功 = ${result.successCount} 失败 = ${result.failCount} 用时 = ${elapsed}s`, 'ok');
            } else {
                resultDiv.innerHTML = `<div style="color:#ff4d4f;">批量写入失败: ${result.err || '未知错误'}</div>`;
                addLog(`批量写入失败: ${result.err || '未知错误'}`, 'err');
            }
        } catch (err) {
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
            resultDiv.innerHTML = `<div style="color:#ff4d4f;">批量写入异常: ${err.message} (${elapsed}s)</div>`;
            addLog(`批量写入异常: ${err.message}`, 'err');
        }

        // === 解锁：无论成败，都允许下一轮 ===
        batchPutBusy = false;
        if (btn) btn.disabled = false;

        await refreshStatus();
    }

    initShardSelect();
    initBatchShardSelect();
    generateKeyPool();   // 页面加载时预生成 key 池
    refreshStatus();
    recalculateLogLayout();

    // 自适应退避调度刷新：成功 3s，每次失败 +2s（上限 15s）
    function scheduleRefresh() {
        const baseInterval = 3000; // 基础 3s
        const maxInterval = 15000; // 上限 15s
        const backoff = Math.min(refreshFailCount * 2000, maxInterval - baseInterval);
        const interval = baseInterval + backoff;
        if (refreshTimer) clearTimeout(refreshTimer);
        refreshTimer = setTimeout(() => { refreshStatus().finally(scheduleRefresh); }, interval);
    }
    scheduleRefresh();

    // ========== SSE Leader 变更推送 ==========
    // Leader 变更时通过 SSE 即时通知前端，触发轻量刷新节点状态（不改"更新于"时间戳）
    let sseReconnectTimer = null;
    function connectSSE() {
        if (sseReconnectTimer) {
            clearTimeout(sseReconnectTimer);
            sseReconnectTimer = null;
        }
        const evtSource = new EventSource('/api/events');
        evtSource.addEventListener('leader-change', function(e) {
            lightRefreshNodeStatus();
        });
        evtSource.onerror = function() {
            evtSource.close();
            // 断线后 5 秒自动重连
            sseReconnectTimer = setTimeout(connectSSE, 5000);
        };
    }
    connectSSE();

    async function lightRefreshNodeStatus() {
        try {
            const tree = await api('/api/status/tree', {method: 'GET'}, 8000, true);
            if (tree) {
                usingCache = !!tree.configCached;
                cachedTree = tree;
                renderNodeStatus(tree);
                renderShards(tree);
                if (tree.groups && tree.groups.length > 0) {
                    populateGroupSelect([...tree.groups].sort((a, b) => a.gid - b.gid));
                }
                // 不改变 refreshInfo.textContent，保留现有"更新于"时间戳
            }
        } catch (err) {
            // 静默，不输出日志
        }
    }

    // ========== 观测日志 ==========
    observeLogExpanded = false;
    let observeLogLastId = 0; // 用游标 Id 而非数组长度，避免环形缓冲区满后增量失效

    async function toggleObserveLog() {
        const area = document.getElementById('observeLogArea');
        const toggle = document.getElementById('observeLogToggle');
        observeLogExpanded = !observeLogExpanded;
        area.style.display = observeLogExpanded ? 'block' : 'none';
        toggle.textContent = observeLogExpanded ? '收起' : '展开';
        if (observeLogExpanded) {
            // 展开时重置游标为0，先 await 首次拉取完成后再启动轮询
            observeLogLastId = 0;
            area.innerHTML = '';
            await fetchObserveLogs();
            startObserveLogPoll();
        } else {
            stopObserveLogPoll();
        }
        recalculateLogLayout();
    }

    // 观测日志标签颜色映射
    const OBSERVE_LOG_COLORS = {
        'Election': '#667eea',
        'Migration': '#f6d365',
        'KVSubmit': '#52c41a',
        'Fault': '#ff4d4f',
    };
    const OBSERVE_LOG_NAMES = {
        'Election': 'Raft选举',
        'Migration': '分片迁移',
        'KVSubmit': 'KV操作',
        'Fault': '故障恢复',
    };

    // 迁移子类型颜色：freeze/冻结=冰蓝色, delete/删除=琥珀色, install/安装=绿色
    function getMigrationColor(text) {
        if (text.includes('冻结')) return '#00b4d8'; // 冰蓝色
        if (text.includes('删除')) return '#e68a00'; // 琥珀色
        if (text.includes('安装')) return '#52c41a'; // 绿色
        return null;
    }

    function addObserveLog(tag, text, unixMilli) {
        const area = document.getElementById('observeLogArea');
        const time = unixMilli ? new Date(unixMilli).toLocaleTimeString() : new Date().toLocaleTimeString();
        const tagColor = OBSERVE_LOG_COLORS[tag] || '#1890ff';
        const tagName = OBSERVE_LOG_NAMES[tag] || tag;
        // 迁移日志主体按子类型（Freeze/Delete/Install）着色，标签保持原有颜色
        let textColor = '';
        if (tag === 'Migration') {
            textColor = getMigrationColor(text) || '';
        }
        const entry = document.createElement('div');
        const textStyle = textColor ? `style="color:${textColor};"` : '';
        entry.innerHTML = `<span class="log-time">[${time}]</span> <span style="color:${tagColor};font-weight:600;">[${tagName}]</span> <span ${textStyle}>${escapeHtml(text)}</span>`;
        area.appendChild(entry);
        area.scrollTop = area.scrollHeight;
        while (area.children.length > 200) {
            area.removeChild(area.firstChild);
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    let observeLogPollTimer = null;
    const OBSERVE_LOG_POLL_INTERVAL = 500; // 500ms 轮询间隔

    function startObserveLogPoll() {
        if (observeLogPollTimer) return;
        // 用 setTimeout 链式调用替代 setInterval，确保前一次完成后再发起下一次
        async function pollLoop() {
            if (!observeLogPollTimer) return;
            await fetchObserveLogs();
            observeLogPollTimer = setTimeout(pollLoop, OBSERVE_LOG_POLL_INTERVAL);
        }
        observeLogPollTimer = setTimeout(pollLoop, OBSERVE_LOG_POLL_INTERVAL);
    }

    function stopObserveLogPoll() {
        if (observeLogPollTimer) {
            clearTimeout(observeLogPollTimer);
            observeLogPollTimer = null;
        }
    }

    async function fetchObserveLogs() {
        try {
            const resp = await fetch(API + '/api/observe/logs?since=' + observeLogLastId, {method: 'GET'});
            if (!resp.ok) return;
            const data = await resp.json();
            if (!data.lines || data.lines.length === 0) {
                // 即使没新行也更新 nextId，避免游标落后太多
                if (data.nextId > observeLogLastId) {
                    observeLogLastId = data.nextId;
                }
                return;
            }

            // 用后端返回的 nextId 更新游标，精确增量获取
            if (data.nextId > observeLogLastId) {
                observeLogLastId = data.nextId;
            }
            for (const line of data.lines) {
                addObserveLog(line.tag, line.text, line.unixMilli);
            }
        } catch (err) {
            // 静默失败
        }
    }

    async function toggleObserve(el) {
        const scene = el.dataset.scene;
        const on = el.checked;
        try {
            const resp = await fetch(API + '/api/observe', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({scene, on})
            });
            if (!resp.ok) {
                el.checked = !on; // 回滚
            }
            // 展开观测日志面板
            const observeLogToggle = document.getElementById('observeLogToggle');
            if (on && observeLogToggle.textContent === '展开') {
                toggleObserveLog();
            }
        } catch (err) {
            el.checked = !on; // 回滚
        }
    }

    // 初始化观测日志状态（从后端拉取当前开关状态）
    async function initObserveState() {
        try {
            const resp = await fetch(API + '/api/observe', {method: 'GET'});
            if (!resp.ok) return;
            const data = await resp.json();
            document.querySelectorAll('.observe-toggle').forEach(el => {
                const scene = el.dataset.scene;
                if (data[scene] !== undefined) {
                    el.checked = data[scene];
                }
            });
        } catch (err) {}
    }

    window.addEventListener('load', async function() {
        try {
            const [reliableRes, paramsRes] = await Promise.all([
                api('/api/network/reliable', {method: 'GET'}),
                api('/api/network/params', {method: 'GET'})
            ]);
            if (paramsRes) {
                netParams = paramsRes;
                // 同步滑块 UI 到后端返回的值
                document.getElementById('dropRateSlider').value = paramsRes.dropRate;
                document.getElementById('dropRateLabel').textContent = (paramsRes.dropRate / 10).toFixed(0) + '%';
                document.getElementById('shortDelaySlider').value = paramsRes.shortDelayMs;
                document.getElementById('shortDelayLabel').textContent = '0~' + paramsRes.shortDelayMs + 'ms';
                document.getElementById('longDelaySlider').value = paramsRes.longDelayMs;
                document.getElementById('longDelayLabel').textContent = '0~' + paramsRes.longDelayMs + 'ms';
            }
            if (reliableRes && reliableRes.reliable === false) {
                document.getElementById('unreliableToggle').checked = true;
                document.getElementById('unreliableLabel').textContent = '开启 (丢包+延迟)';
                document.getElementById('unreliableLabel').style.color = '#ff4d4f';
            }
            if (reliableRes && reliableRes.longReordering) {
                document.getElementById('longReorderingToggle').checked = true;
                document.getElementById('longReorderingLabel').textContent = '开启';
            }
        } catch(e) {}
        // 初始化三个 slider 的禁用状态，与 toggle 保持一致
        updateSliderDisabledState(document.getElementById('unreliableToggle').checked);
        // 初始化观测日志状态（默认收起，不拉取日志，等用户开启开关再展开）
        await initObserveState();
    });

    // ========== CAS 并发竞赛（后端并发) ==========
    //
    // 前端发送 1 个 POST 到 /api/kv/cas-race，后端启动 N 个独立 Clerk 并发 CAS Put。
    //
    async function doCasRace() {
        const key = document.getElementById('raceKey').value.trim();
        const nClient = parseInt(document.getElementById('raceNClient').value) || 5;
        if (!key) {
            addLog('CAS 竞赛: Key 不能为空', 'err');
            return;
        }
        if (nClient < 1 || nClient > 1000) {
            addLog('CAS 竞赛: 客户端数必须在 1~1000 之间', 'err');
            return;
        }
        document.getElementById('putKey').value = key;
        document.getElementById('getKey').value = key;

        const resultDiv = document.getElementById('raceResult');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `<div style="color:#764ba2;"><span class="spinner-cas"></span> CAS 竞赛进行中 (${nClient} 并发请求)...</div>`;
        addLog(`CAS 竞赛开始: ${nClient} 个客户端并发 CAS Put key="${key}"`, 'shard');
        try {
            const result = await api('/api/kv/cas-race', {
                method: 'POST',
                body: JSON.stringify({key, nClient})
            }, 60000);

            if (result.success) {
                addLog(`CAS 竞赛完成: 成功=${result.successCount} 冲突=${result.versionErrCount} → 最终="${result.finalValue}" 用时=${result.elapsed}s`, 'shard');
                resultDiv.innerHTML = `<div style="color:#764ba2;">成功 <strong>${result.successCount}</strong> / 版本冲突 <strong>${result.versionErrCount}</strong> | 最终 "${result.finalValue}" | 用时 ${result.elapsed}s</div>`;
                document.getElementById('putVal').value = result.finalValue || '';
            } else {
                addLog(`CAS 竞赛失败: ${result.err || '未知错误'}`, 'err');
                resultDiv.innerHTML = `<div style="color:#ff4d4f;">CAS 竞赛失败: ${result.err || '未知错误'}</div>`;
            }
        } catch (err) {
            addLog(`CAS 竞赛异常: ${err.message}`, 'err');
            resultDiv.innerHTML = `<div style="color:#ff4d4f;">CAS 竞赛异常: ${err.message}</div>`;
        }

        await refreshStatus();
    }

</script>
